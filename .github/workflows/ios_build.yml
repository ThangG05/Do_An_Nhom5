name: Build HVNH Hub iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobilehvnh
    env:
      IOS_BUNDLE_ID: vn.edu.hvnh.hub
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
      IOS_GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.IOS_GOOGLE_REVERSED_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: mobilehvnh/pubspec.lock

      - name: Validate required signing and OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_TEAM_ID IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_PROFILE_NAME IOS_GOOGLE_CLIENT_ID IOS_GOOGLE_REVERSED_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Configure Google Sign-In for iOS
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string ${IOS_GOOGLE_CLIENT_ID}" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ${IOS_GOOGLE_REVERSED_CLIENT_ID}" ios/Runner/Info.plist

      - name: Install iOS signing certificate and profile
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/hvnhhub-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/signing-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/adhoc-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(uuidgen)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          rm -f "$CERTIFICATE_PATH" "$PROFILE_PATH" "$PROFILE_PLIST"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create export options
        shell: bash
        run: |
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "ad-hoc",
              "signingStyle": "manual",
              "teamID": os.environ["IOS_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["IOS_PROFILE_NAME"]
              },
              "stripSwiftSymbols": True,
          }
          with open("ios/ExportOptions.plist", "wb") as f:
              plistlib.dump(options, f)
          PY

      - name: Build signed IPA
        run: >-
          flutter build ipa --release
          --export-options-plist=ios/ExportOptions.plist
          --dart-define=API_BASE_URL=https://hvnhhub.id.vn/api/v1
          --dart-define=WEB_BASE_URL=https://hvnhhub.id.vn

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hvnhhub-ios-ipa
          path: mobilehvnh/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
